<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Daily Art local gallery fallback</title>
  <desc id="desc">A serene, abstract landscape painting in a museum frame.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9cda0"/>
      <stop offset=".46" stop-color="#d5a878"/>
      <stop offset="1" stop-color="#324c63"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f2dcb4"/>
      <stop offset="1" stop-color="#d88f68"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#637b82"/>
      <stop offset="1" stop-color="#172f43"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3d796"/>
      <stop offset=".5" stop-color="#7f5935"/>
      <stop offset="1" stop-color="#e3c17c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="inside"><rect x="98" y="78" width="1004" height="744" rx="4"/></clipPath>
  </defs>
  <rect width="1200" height="900" fill="#101a27"/>
  <rect x="49" y="34" width="1102" height="832" rx="24" fill="#000" opacity=".36"/>
  <rect x="66" y="48" width="1068" height="804" rx="18" fill="url(#frame)"/>
  <rect x="82" y="63" width="1036" height="774" rx="9" fill="#35291f"/>
  <g clip-path="url(#inside)">
    <rect x="98" y="78" width="1004" height="744" fill="url(#canvas)"/>
    <rect x="98" y="78" width="1004" height="485" fill="url(#sky)"/>
    <circle cx="788" cy="284" r="134" fill="#f4d89f" opacity=".77" filter="url(#soft)"/>
    <circle cx="788" cy="284" r="78" fill="#f4ce85" opacity=".83"/>
    <path d="M98 524 260 354l128 112 164-216 202 247 133-162 215 172v94H98Z" fill="#53606a" opacity=".83"/>
    <path d="m98 575 196-168 148 133 180-179 171 201 154-123 155 133v73H98Z" fill="#344b57"/>
    <path d="M98 561c134-33 235 8 357 3 134-6 215-42 349-23 112 17 203 1 298-10v291H98Z" fill="url(#water)"/>
    <path d="M594 567c95 17 165 15 245-2 67-14 135-14 210-2" fill="none" stroke="#eac486" stroke-width="17" stroke-linecap="round" opacity=".48"/>
    <path d="M497 630c113-19 180-8 274 8 97 17 190 17 269-4" fill="none" stroke="#dcae78" stroke-width="10" stroke-linecap="round" opacity=".33"/>
    <path d="M362 822c12-106 18-193 61-277m-62 277c-37-85-74-130-119-170m119 170c32-95 80-145 137-184" fill="none" stroke="#172b31" stroke-width="23" stroke-linecap="round"/>
    <path d="M420 658c-80-40-113-32-149-6 37 45 83 53 149 6Zm-49 73c-51-58-88-73-133-65 20 54 67 77 133 65Zm88-45c60-52 104-62 151-42-32 51-82 66-151 42Z" fill="#b1a476" opacity=".87"/>
    <path d="M108 159c148 18 240 14 361-7m-350 44c121 10 193 7 284-4M850 445c82 15 148 11 232-4" fill="none" stroke="#fff1d2" stroke-width="12" stroke-linecap="round" opacity=".2"/>
    <rect x="98" y="78" width="1004" height="744" fill="transparent" filter="url(#grain)" opacity=".5"/>
  </g>
  <rect x="91" y="71" width="1018" height="758" rx="7" fill="none" stroke="#fff0c9" stroke-opacity=".45" stroke-width="3"/>
</svg>
