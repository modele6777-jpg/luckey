<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- 1. Pure Solid White Opaque Canvas -->
  <rect width="512" height="512" fill="#ffffff" />

  <!-- 2. Ultra-Minimal Symmetrical Four-Leaf Clover in Spring Light Green (#b4e77c) -->
  <g transform="translate(256, 256)" fill="#b4e77c">
    <!-- Top Heart Petal -->
    <path d="M 0 -14
             C -24 -46, -74 -64, -74 -112
             C -74 -152, -32 -166, 0 -130
             C 32 -166, 74 -152, 74 -112
             C 74 -64, 24 -46, 0 -14 Z" />

    <!-- Right Heart Petal -->
    <path d="M 0 -14
             C -24 -46, -74 -64, -74 -112
             C -74 -152, -32 -166, 0 -130
             C 32 -166, 74 -152, 74 -112
             C 74 -64, 24 -46, 0 -14 Z"
          transform="rotate(90)" />

    <!-- Bottom Heart Petal -->
    <path d="M 0 -14
             C -24 -46, -74 -64, -74 -112
             C -74 -152, -32 -166, 0 -130
             C 32 -166, 74 -152, 74 -112
             C 74 -64, 24 -46, 0 -14 Z"
          transform="rotate(180)" />

    <!-- Left Heart Petal -->
    <path d="M 0 -14
             C -24 -46, -74 -64, -74 -112
             C -74 -152, -32 -166, 0 -130
             C 32 -166, 74 -152, 74 -112
             C 74 -64, 24 -46, 0 -14 Z"
          transform="rotate(270)" />
  </g>
</svg>