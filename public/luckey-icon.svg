<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Pristine Minimal White Canvas Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </radialGradient>

    <!-- Subtle Ambient Emerald Glow Behind Clover -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Vibrant Emerald Petal Gradients Optimized for Crisp White Background -->
    <linearGradient id="petalTop" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="petalRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="petalBottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="petalLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Golden Core Sparkle Accent -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Pure Opaque Minimal White Canvas -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="112" />

  <!-- 2. Ambient Soft Emerald Glow -->
  <circle cx="256" cy="246" r="180" fill="url(#centerGlow)" />

  <!-- 3. Minimalist Iconic Clover -->
  <g transform="translate(256, 246)">
    <!-- 4 Symmetrical Modern Heart-Shaped Petals -->
    <!-- Top Petal -->
    <path d="M 0 -8
             C -22 -32, -62 -48, -62 -92
             C -62 -132, -26 -146, 0 -114
             C 26 -146, 62 -132, 62 -92
             C 62 -48, 22 -32, 0 -8 Z"
          fill="url(#petalTop)" />

    <!-- Right Petal -->
    <path d="M 0 -8
             C -22 -32, -62 -48, -62 -92
             C -62 -132, -26 -146, 0 -114
             C 26 -146, 62 -132, 62 -92
             C 62 -48, 22 -32, 0 -8 Z"
          transform="rotate(90)"
          fill="url(#petalRight)" />

    <!-- Bottom Petal -->
    <path d="M 0 -8
             C -22 -32, -62 -48, -62 -92
             C -62 -132, -26 -146, 0 -114
             C 26 -146, 62 -132, 62 -92
             C 62 -48, 22 -32, 0 -8 Z"
          transform="rotate(180)"
          fill="url(#petalBottom)" />

    <!-- Left Petal -->
    <path d="M 0 -8
             C -22 -32, -62 -48, -62 -92
             C -62 -132, -26 -146, 0 -114
             C 26 -146, 62 -132, 62 -92
             C 62 -48, 22 -32, 0 -8 Z"
          transform="rotate(270)"
          fill="url(#petalLeft)" />

    <!-- Minimal Elegant Stem -->
    <path d="M 0 12 Q 18 80, -8 132"
          stroke="#059669"
          stroke-width="5"
          stroke-linecap="round"
          fill="none"
          opacity="0.9" />

    <!-- Subtle Inner Star / LucKey Sparkle at Center -->
    <circle cx="0" cy="-8" r="16" fill="url(#coreGlow)" />
    <circle cx="0" cy="-8" r="4" fill="#fbbf24" />
  </g>
</svg>
