<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep Cosmic Sanctuary Background (100% Opaque for iOS & Android PWA) -->
    <radialGradient id="lkBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#0d131a" />
      <stop offset="55%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#050609" />
    </radialGradient>

    <!-- Ambient Emerald & Amber Glows -->
    <radialGradient id="emeraldHalo" cx="46%" cy="44%" r="46%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberHalo" cx="54%" cy="56%" r="44%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Squircle Card Surface -->
    <linearGradient id="cardSurface" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10181b" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#161821" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#141e28" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#fcd34d" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.42" />
    </linearGradient>

    <!-- Center Core Soft Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="34%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="topStarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Full-Bleed Opaque Base Canvas -->
  <rect width="512" height="512" fill="url(#lkBg)" />

  <!-- 2. Ambient Emerald & Golden Vignette Glows -->
  <circle cx="240" cy="226" r="220" fill="url(#emeraldHalo)" />
  <circle cx="276" cy="286" r="200" fill="url(#amberHalo)" />

  <!-- 3. Outer Breathing Emerald Hairline Ring & Dashed Golden Orbit Ring -->
  <circle
    cx="256"
    cy="256"
    r="204"
    stroke="#34d399"
    stroke-opacity="0.26"
    stroke-width="2.2"
  />
  <circle
    cx="256"
    cy="256"
    r="178"
    stroke="#fbbf24"
    stroke-opacity="0.26"
    stroke-width="2"
    stroke-dasharray="7 9"
  />
  <!-- Top Orbit Star Dot -->
  <circle cx="256" cy="78" r="16" fill="url(#topStarGlow)" />
  <circle cx="256" cy="78" r="5.5" fill="#fde047" />

  <!-- 4. Central Rounded-3XL Sanctuary Card -->
  <rect
    x="116"
    y="116"
    width="280"
    height="280"
    rx="68"
    fill="url(#cardSurface)"
    stroke="url(#cardBorder)"
    stroke-width="2.8"
  />
  <circle cx="256" cy="256" r="120" fill="url(#coreGlow)" />

  <!-- 5. Official LucKey Emblem: Four-Leaf Emerald Clover + Golden Celestial Key -->
  <g transform="translate(256, 250) scale(11.5) translate(-16, -16.8)">
    <!-- Four-leaf Clover Subtle Petals -->
    <g
      stroke="#34d399"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- Top Leaf -->
      <path
        d="M16 16 C16 11, 12 9, 12 12 C12 15, 16 16, 16 16"
        fill="#34d399"
        fill-opacity="0.25"
      />
      <!-- Right Leaf -->
      <path
        d="M16 16 C21 16, 23 12, 20 12 C17 12, 16 16, 16 16"
        fill="#34d399"
        fill-opacity="0.25"
      />
      <!-- Bottom Leaf -->
      <path
        d="M16 16 C16 21, 20 23, 20 20 C20 17, 16 16, 16 16"
        fill="#34d399"
        fill-opacity="0.25"
      />
      <!-- Left Leaf -->
      <path
        d="M16 16 C11 16, 9 20, 12 20 C15 20, 16 16, 16 16"
        fill="#34d399"
        fill-opacity="0.25"
      />
    </g>

    <!-- Minimal Golden Celestial Key Accent -->
    <g
      stroke="#fcd34d"
      stroke-width="1.55"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="16" cy="16" r="2.5" fill="#fde047" stroke="none" />
      <path d="M16 18.5 L16 25" />
      <path d="M16 23 L18.5 23" />
      <path d="M16 25 L18 25" />
    </g>
  </g>
</svg>