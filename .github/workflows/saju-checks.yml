name: Saju regression checks

on:
  pull_request:
    paths:
      - 'api/index.ts'
      - 'server/api-lib/mcpHandler.ts'
      - 'src/lib/sajuAnalysis.ts'
      - 'src/lib/astronomicalSolarTerms.ts'
      - 'src/lib/lunarCalendar.ts'
      - 'tests/saju-boundaries.test.ts'
      - 'tests/saju-clock-and-elements.test.ts'
      - 'tests/saju-surface-interpretation.test.ts'
      - 'tests/mcp-saju.test.ts'
      - 'tests/mcp-streamable.test.ts'
      - 'tests/mcp-query-auth.test.ts'
      - 'tests/reading-api-origin.test.ts'
      - 'server/api-lib/mcpAuth.ts'
      - 'server/api-lib/mcpCatalog.ts'
      - 'server/api-lib/mcpReadingGateway.ts'
      - 'server/api-lib/mcpStreamable.ts'
      - 'server/api-lib/mcpVersion.ts'
      - 'server/api-lib/readingApiClient.ts'
      - 'server/api-lib/sajuChartApi.ts'
      - 'server/api-lib/sajuChartRoute.ts'
      - 'tests/server-import-extensions.test.ts'
      - 'tests/prod-audit-routes.test.ts'
      - 'tests/tts-highlight-match.test.ts'
      - 'src/lib/ttsHighlightMatch.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/saju-checks.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx --test tests/saju-boundaries.test.ts tests/saju-clock-and-elements.test.ts tests/saju-surface-interpretation.test.ts tests/mcp-saju.test.ts tests/mcp-streamable.test.ts tests/mcp-query-auth.test.ts tests/reading-api-origin.test.ts tests/server-import-extensions.test.ts tests/prod-audit-routes.test.ts tests/tts-highlight-match.test.ts
      - run: npm run build
