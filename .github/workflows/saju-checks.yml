name: Saju regression checks

on:
  pull_request:
    paths:
      - 'api/index.ts'
      - 'server/api-lib/mcpHandler.ts'
      - 'src/lib/sajuAnalysis.ts'
      - 'src/lib/astronomicalSolarTerms.ts'
      - 'src/lib/lunarCalendar.ts'
      - 'tests/saju-boundaries.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/saju-checks.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx --test tests/saju-boundaries.test.ts
      - run: npm run build
